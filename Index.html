<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suara AI Sabah</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#0b3d2e,#146b52);
  color: white;
  text-align: center;
}
.container {
  max-width: 600px;
  margin: auto;
  padding: 30px 20px;
}
h1 { font-size: 32px; }
p { opacity: .9; }
button {
  border: none;
  border-radius: 50px;
  padding: 16px 25px;
  margin: 10px;
  font-size: 18px;
  cursor: pointer;
}
#mic { background: #fff; color: #0b3d2e; }
#stop { background: #d9534f; color: white; }
.box {
  background: rgba(255,255,255,.12);
  padding: 20px;
  border-radius: 18px;
  margin-top: 20px;
  min-height: 100px;
}
</style>
</head>

<body>
<div class="container">

<h1>🎙️ Suara AI Sabah</h1>
<p>Tekan mikrofon dan bercakap.</p>

<button id="mic">🎤 Mula Bercakap</button>
<button id="stop">⏹ Berhenti</button>

<div class="box">
  <h3>Suara anda:</h3>
  <div id="result">Belum ada suara...</div>
</div>

</div>

<script>
const result = document.getElementById("result");
const mic = document.getElementById("mic");
const stop = document.getElementById("stop");

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognition) {
  const recognition = new SpeechRecognition();
  recognition.lang = "ms-MY";
  recognition.continuous = true;
  recognition.interimResults = true;

  mic.onclick = () => {
    recognition.start();
    result.innerText = "Mendengar...";
  };

  stop.onclick = () => {
    recognition.stop();
  };

  recognition.onresult = (event) => {
    let text = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      text += event.results[i][0].transcript;
    }
    result.innerText = text;
  };
} else {
  result.innerText = "Pelayar anda tidak menyokong fungsi suara.";
}
</script>

</body>
</html>
