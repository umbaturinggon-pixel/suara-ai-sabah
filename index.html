<!DOCTYPE html><html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suara AI Sabah</title><style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #064e3b, #0f766e);
    color: white;
    text-align: center;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 30px 20px;
}

h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

p {
    font-size: 17px;
    opacity: 0.9;
}

button {
    border: none;
    border-radius: 50px;
    padding: 15px 22px;
    margin: 8px;
    font-size: 17px;
    cursor: pointer;
}

.start {
    background: white;
    color: #064e3b;
}

.stop {
    background: #dc2626;
    color: white;
}

.play {
    background: #facc15;
    color: black;
}

.box {
    background: rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 20px;
    margin-top: 25px;
}

#text {
    min-height: 80px;
    font-size: 18px;
    line-height: 1.5;
}

audio {
    width: 100%;
    margin-top: 20px;
}
</style></head><body><div class="container"><h1>🎙️ Suara AI Sabah</h1><p>Tekan butang untuk merakam suara anda.</p><button class="start" onclick="mulaRakam()">
🎤 Mula Rakam
</button><button class="stop" onclick="berhentiRakam()">
⏹️ Berhenti
</button><button class="play" onclick="mainRakaman()">
🔊 Dengar Rakaman
</button><div class="box"><h3>📝 Teks Suara</h3><div id="text">
Belum ada rakaman...
</div></div><audio id="audio" controls></audio>

</div><script>

let mediaRecorder;
let audioChunks = [];
let audioURL = "";

async function mulaRakam() {

    try {

        const stream = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        audioChunks = [];

        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = function(event) {
            if (event.data.size > 0) {
                audioChunks.push(event.data);
            }
        };

        mediaRecorder.onstop = function() {

            const audioBlob = new Blob(audioChunks, {
                type: "audio/webm"
            });

            audioURL = URL.createObjectURL(audioBlob);

            document.getElementById("audio").src = audioURL;

            document.getElementById("text").innerText =
                "✅ Rakaman selesai. Tekan 🔊 Dengar Rakaman.";

        };

        mediaRecorder.start();

        document.getElementById("text").innerText =
            "🎙️ Sedang merakam suara...";

    } catch (error) {

        document.getElementById("text").innerText =
            "❌ Mikrofon tidak dibenarkan. Sila benarkan akses mikrofon.";

    }
}

function berhentiRakam() {

    if (mediaRecorder && mediaRecorder.state !== "inactive") {

        mediaRecorder.stop();

        mediaRecorder.stream.getTracks().forEach(track => {
            track.stop();
        });

    }

}

function mainRakaman() {

    if (audioURL) {

        document.getElementById("audio").play();

    } else {

        document.getElementById("text").innerText =
            "⚠️ Belum ada rakaman.";

    }

}

</script></body>
</html>
